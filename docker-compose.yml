version: '3.8'

services:
  parakeet-api:
    container_name: parakeet-api
    build: ./parakeet
    volumes:
      - hf-cache:/cache
    restart: unless-stopped

  python-be:
    container_name: python-be
    build: ./backend
    environment:
      - PARAKEET_URL=http://parakeet-api:8090/transcribe
    depends_on:
      - parakeet-api
    restart: unless-stopped

  nginx-fe:
    container_name: nginx-fe
    build: ./frontend
    ports:
      - "8443:443"
    volumes:
      - ssl-certs:/etc/nginx/ssl
    depends_on:
      - python-be
    restart: unless-stopped

volumes:
  ssl-certs:
  hf-cache:
