<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>STT at Home</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STT" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-hover: #7c74ff;
      --red: #ff4d6a;
      --text: #e8eaf0;
      --muted: #7a7e92;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 24px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Record button ── */
    #record-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #record-btn svg { transition: transform 0.15s; }

    #record-btn:active { transform: scale(0.93); }

    #record-btn.recording {
      border-color: var(--red);
      box-shadow: 0 0 0 6px rgba(255,77,106,0.2);
      animation: pulse 1.4s ease-in-out infinite;
    }

    #record-btn.recording .mic-icon { display: none; }
    #record-btn.recording .stop-icon { display: block !important; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(255,77,106,0.2); }
      50%       { box-shadow: 0 0 0 12px rgba(255,77,106,0.08); }
    }

    #status {
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: center;
    }

    #retry-btn {
      display: none;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    #retry-btn.visible { display: inline-block; }
    #retry-btn:hover, #retry-btn:active { background: var(--red); color: #fff; }

    /* ── Result card ── */
    #result-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #result-card.visible { display: flex; }

    #result-text {
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: break-word;
    }

    #copy-btn {
      align-self: flex-end;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    #copy-btn:hover, #copy-btn:active { background: var(--border); }
    #copy-btn.copied { color: #4ade80; border-color: #4ade80; }

    /* ── History ── */
    #history-section {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-header h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    #clear-btn {
      font-size: 0.78rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }

    #clear-btn:hover { color: var(--red); }

    #history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .history-text {
      font-size: 0.9rem;
      line-height: 1.5;
      flex: 1;
      word-break: break-word;
    }

    .history-copy {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .history-copy:hover { color: var(--text); }
    .history-copy.copied { color: #4ade80; }

    .empty-state {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      padding: 16px 0;
    }

    .stop-icon { display: none; }

    /* ── Language toggle ── */
    #lang-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    #lang-toggle button {
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    #lang-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>STT at Home</h1>

  <div id="lang-toggle">
    <button id="lang-nl" class="active" data-lang="nl">NL</button>
    <button id="lang-en" data-lang="en">EN</button>
  </div>

  <button id="record-btn" aria-label="Opnemen">
    <!-- mic icon -->
    <svg class="mic-icon" width="36" height="36" viewBox="0 0 24 24" fill="none"
         stroke="#6c63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="11" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8"  y1="22" x2="16" y2="22"/>
    </svg>
    <!-- stop icon -->
    <svg class="stop-icon" width="32" height="32" viewBox="0 0 24 24" fill="#ff4d6a">
      <rect x="4" y="4" width="16" height="16" rx="3"/>
    </svg>
  </button>

  <p id="status">Tik om op te nemen</p>
  <button id="retry-btn">Opnieuw proberen</button>

  <div id="result-card">
    <p id="result-text"></p>
    <button id="copy-btn">Kopieer</button>
  </div>

  <section id="history-section">
    <div class="history-header">
      <h2>Geschiedenis</h2>
      <button id="clear-btn">Wissen</button>
    </div>
    <div id="history-list">
      <p class="empty-state">Nog geen transcripties</p>
    </div>
  </section>

  <script>
    const recordBtn   = document.getElementById('record-btn');
    const statusEl    = document.getElementById('status');
    const retryBtn    = document.getElementById('retry-btn');
    const resultCard  = document.getElementById('result-card');
    const resultText  = document.getElementById('result-text');
    const copyBtn     = document.getElementById('copy-btn');
    const historyList = document.getElementById('history-list');
    const clearBtn    = document.getElementById('clear-btn');

    let mediaRecorder = null;
    let chunks = [];
    let recording = false;
    let selectedLang = 'nl';
    let pendingRecording = null; // { blob, language } of the latest failed attempt, if any
    let activeSeg = null;        // segmenter of the recording in progress, if supported

    // ── Segmented transcription: cut the recording at pauses and transcribe each
    // piece while still talking, so at stop only the last few seconds remain.
    // The full MediaRecorder blob is kept as fallback if any segment fails.
    const SEG_MIN_SEC = 8;        // don't cut before this much audio (each cut costs a full whisper pass)
    const SEG_MAX_SEC = 28;       // whisper's window is 30s; force a cut before that
    const SILENCE_CUT_SEC = 0.6;  // pause length that triggers a cut

    const WORKLET_SRC = `
      class Tap extends AudioWorkletProcessor {
        constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
        process(inputs) {
          const ch = inputs[0][0];
          if (ch) for (let i = 0; i < ch.length; i++) {
            this.buf[this.n++] = ch[i];
            if (this.n === this.buf.length) {
              this.port.postMessage(this.buf);
              this.buf = new Float32Array(2048);
              this.n = 0;
            }
          }
          return true;
        }
      }
      registerProcessor('tap', Tap);`;

    async function startSegmenter(ctx, stream, language) {
      try {
        const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        const source = ctx.createMediaStreamSource(stream);
        const node = new AudioWorkletNode(ctx, 'tap');
        const seg = {
          ctx, source, node, language, sampleRate: ctx.sampleRate,
          chunks: [], levels: [], speech: [], len: 0, silentRun: 0, floor: null,
          texts: [], queue: Promise.resolve(), failed: null,
        };
        node.port.onmessage = e => onAudioChunk(seg, e.data);
        source.connect(node);
        node.connect(ctx.destination); // outputs silence; keeps the node pulled by the graph
        await ctx.resume();
        return seg;
      } catch {
        ctx.close().catch(() => {});
        return null;
      }
    }

    function onAudioChunk(seg, chunk) {
      let sum = 0;
      for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
      const rms = Math.sqrt(sum / chunk.length);
      seg.floor = seg.floor === null ? rms
        : rms < seg.floor ? seg.floor * 0.7 + rms * 0.3   // drop fast to quiet moments
        : seg.floor * 0.999 + rms * 0.001;                // creep up slowly during speech
      const isSpeech = rms > 0.02 || rms > Math.max(seg.floor * 3, 0.003);
      const isSilent = rms < seg.floor * 2 + 0.001;

      seg.chunks.push(chunk);
      seg.levels.push(rms);
      seg.speech.push(isSpeech);
      seg.len += chunk.length;
      seg.silentRun = isSilent ? seg.silentRun + chunk.length / seg.sampleRate : 0;

      const sec = seg.len / seg.sampleRate;
      if (sec >= SEG_MIN_SEC && seg.silentRun >= SILENCE_CUT_SEC) {
        cutSegment(seg, seg.chunks.length);
      } else if (sec >= SEG_MAX_SEC) {
        // No pause found: cut at the quietest moment in the last third
        let best = seg.chunks.length - 1;
        for (let i = Math.floor(seg.chunks.length * 2 / 3); i < seg.chunks.length; i++) {
          if (seg.levels[i] < seg.levels[best]) best = i;
        }
        cutSegment(seg, best + 1);
      }
    }

    function cutSegment(seg, n) {
      const chunks = seg.chunks.splice(0, n);
      seg.levels.splice(0, n);
      const speechCount = seg.speech.splice(0, n).filter(Boolean).length;
      seg.len = seg.chunks.reduce((t, c) => t + c.length, 0);
      seg.silentRun = 0;
      // Skip pure silence: whisper hallucinates text on it
      if (speechCount >= 3) enqueueSegment(seg, encodeWav(chunks, seg.sampleRate));
    }

    function stopSegmenter(seg) {
      seg.node.port.onmessage = null;
      seg.source.disconnect();
      seg.node.disconnect();
      if (seg.chunks.length) cutSegment(seg, seg.chunks.length);
      seg.ctx.close().catch(() => {});
    }

    // Segments go out one at a time, in order, each with the text so far as context
    function enqueueSegment(seg, wav) {
      seg.queue = seg.queue.then(async () => {
        if (seg.failed) return;
        const form = new FormData();
        form.append('audio', wav, 'segment.wav');
        form.append('language', seg.language);
        form.append('prompt', seg.texts.join(' ').slice(-200));
        try {
          const res = await fetch('/api/transcribe', { method: 'POST', body: form });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data.text) {
            seg.texts.push(data.text);
            resultText.textContent = seg.texts.join(' ');
            resultCard.classList.add('visible');
          }
        } catch (err) {
          seg.failed = err;
        }
      });
    }

    function encodeWav(chunks, sampleRate) {
      const len = chunks.reduce((n, c) => n + c.length, 0);
      const v = new DataView(new ArrayBuffer(44 + len * 2));
      const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      str(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); str(8, 'WAVE');
      str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, len * 2, true);
      let o = 44;
      for (const c of chunks) {
        for (let i = 0; i < c.length; i++, o += 2) {
          const x = Math.max(-1, Math.min(1, c[i]));
          v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
        }
      }
      return new Blob([v.buffer], { type: 'audio/wav' });
    }

    // ── Pending (failed) recording persistence — IndexedDB so a 3-5min blob
    // survives a page reload without base64/localStorage bloat or main-thread jank.
    const PENDING_DB = 'stt-at-home';
    const PENDING_STORE = 'pending-recording';
    const PENDING_KEY = 'latest';

    function openPendingDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(PENDING_DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(PENDING_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePendingRecording(blob, language) {
      const db = await openPendingDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PENDING_STORE, 'readwrite');
        tx.objectStore(PENDING_STORE).put({ blob, language, ts: Date.now() }, PENDING_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadPendingRecording() {
      const db = await openPendingDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PENDING_STORE, 'readonly');
        const req = tx.objectStore(PENDING_STORE).get(PENDING_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function clearPendingRecording() {
      const db = await openPendingDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PENDING_STORE, 'readwrite');
        tx.objectStore(PENDING_STORE).delete(PENDING_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function hideRetry() {
      pendingRecording = null;
      retryBtn.classList.remove('visible');
    }

    document.getElementById('lang-toggle').addEventListener('click', e => {
      const btn = e.target.closest('button[data-lang]');
      if (!btn || recording) return;
      selectedLang = btn.dataset.lang;
      document.querySelectorAll('#lang-toggle button').forEach(b => b.classList.toggle('active', b === btn));
    });

    const HISTORY_KEY = 'stt_history';

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
      catch { return []; }
    }

    function saveHistory(h) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
    }

    function renderHistory() {
      const h = loadHistory();
      historyList.innerHTML = '';
      if (!h.length) {
        historyList.innerHTML = '<p class="empty-state">Nog geen transcripties</p>';
        return;
      }
      h.forEach((text, i) => {
        const item = document.createElement('div');
        item.className = 'history-item';

        const span = document.createElement('span');
        span.className = 'history-text';
        span.textContent = text;

        const btn = document.createElement('button');
        btn.className = 'history-copy';
        btn.title = 'Kopieer';
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>`;
        btn.addEventListener('click', () => copyText(text, btn));

        item.appendChild(span);
        item.appendChild(btn);
        historyList.prepend(item);
      });
    }

    function addToHistory(text) {
      const h = loadHistory();
      h.push(text);
      if (h.length > 50) h.shift();
      saveHistory(h);
      renderHistory();
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        if (btn === copyBtn) btn.textContent = 'Gekopieerd!';
        setTimeout(() => {
          btn.classList.remove('copied');
          if (btn === copyBtn) btn.textContent = 'Kopieer';
          else btn.innerHTML = orig;
        }, 1800);
      } catch {
        prompt('Kopieer handmatig:', text);
      }
    }

    async function startRecording() {
      // Created before any await so iOS still counts it as part of the tap
      let ctx = null;
      try { if (window.AudioWorkletNode) ctx = new AudioContext(); } catch {}

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        if (ctx) ctx.close().catch(() => {});
        statusEl.textContent = 'Microfoon toegang geweigerd';
        return;
      }

      hideRetry();
      const language = selectedLang;
      const seg = ctx ? await startSegmenter(ctx, stream, language) : null;
      activeSeg = seg;
      if (seg) {
        resultText.textContent = '';
        resultCard.classList.remove('visible');
      }

      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: 'audio/webm' });
        try { await savePendingRecording(blob, language); } catch {}
        if (!seg) return transcribeBlob(blob, language);
        await seg.queue;
        // A segment failed: redo the whole recording the old way (that path has the retry button)
        if (seg.failed) return transcribeBlob(blob, language);
        showResult(seg.texts.join(' '), language);
      };
      mediaRecorder.start();
      recording = true;
      recordBtn.classList.add('recording');
      statusEl.textContent = 'Opname bezig… tik om te stoppen';
    }

    function stopRecording() {
      if (activeSeg) {
        stopSegmenter(activeSeg);
        activeSeg = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      recording = false;
      recordBtn.classList.remove('recording');
      statusEl.textContent = 'Verwerken…';
    }

    async function transcribeBlob(blob, language) {
      retryBtn.classList.remove('visible');
      statusEl.textContent = 'Verwerken…';

      const form = new FormData();
      form.append('audio', blob, 'recording.webm');
      form.append('language', language);

      try {
        const res = await fetch('/api/transcribe', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        await showResult(data.text || '', data.language);
      } catch (err) {
        pendingRecording = { blob, language };
        retryBtn.classList.add('visible');
        statusEl.textContent = `Fout: ${err.message}`;
      }
    }

    async function showResult(text, language) {
      try { await clearPendingRecording(); } catch {}
      pendingRecording = null;

      if (text) {
        resultText.textContent = text;
        resultCard.classList.add('visible');
        addToHistory(text);
        statusEl.textContent = `Taal: ${language || '?'} — tik om opnieuw op te nemen`;
      } else {
        statusEl.textContent = 'Geen spraak herkend — probeer opnieuw';
      }
    }

    recordBtn.addEventListener('click', () => {
      if (recording) stopRecording();
      else startRecording();
    });

    copyBtn.addEventListener('click', () => copyText(resultText.textContent, copyBtn));

    retryBtn.addEventListener('click', () => {
      if (!pendingRecording || recording) return;
      transcribeBlob(pendingRecording.blob, pendingRecording.language);
    });

    clearBtn.addEventListener('click', () => {
      saveHistory([]);
      renderHistory();
    });

    renderHistory();

    (async () => {
      try {
        const pending = await loadPendingRecording();
        if (pending) {
          pendingRecording = { blob: pending.blob, language: pending.language };
          statusEl.textContent = 'Vorige opname mislukt — tik op opnieuw proberen';
          retryBtn.classList.add('visible');
        }
      } catch {}
    })();
  </script>
</body>
</html>
